<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f4f4;
margin:0;
padding:20px;
}

.container{
max-width:800px;
margin:auto;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.2);
}

input,textarea{
width:100%;
padding:10px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
box-sizing:border-box;
}

button{
background:#0077cc;
color:white;
padding:10px 20px;
border:none;
border-radius:5px;
cursor:pointer;
}

a{
display:inline-block;
margin-top:20px;
text-decoration:none;
background:#0077cc;
color:white;
padding:10px 20px;
border-radius:5px;
}
</style>
</head>

<body>

<div class="container">

<h1>Contact Us</h1>

<p>Fill out the form below to contact us.</p>

  <form id="contactForm">

<input type="text" placeholder="Your Name">

<input type="email" placeholder="Your Email">

<textarea rows="6" placeholder="Your Message"></textarea>

<button>Send Message</button>

<br><br>

<a href="index.html">⬅ Back to Home</a>

</div>

<script src="script.js"></script>
</body>
</html>
